---
- name: Filesystem report and largest files under /home
  hosts: all
  gather_facts: false
  become: true
  become_method: sudo

  vars:
    home_path: /home
    top_n: 20

  tasks:
    - name: Generate filesystem report
      ansible.builtin.raw: |
        HOME_PATH="{{ home_path }}"
        TOP_N="{{ top_n }}"
        REPORT="/tmp/fs_report_{{ inventory_hostname }}.txt"

        {
          echo "Host: {{ inventory_hostname }}"
          echo "Date: $(date '+%Y-%m-%d %H:%M:%S %Z')"
          echo

          echo "=== Filesystems (df -h) ==="
          df -h
          echo

          echo "=== Block Devices (lsblk) ==="

          if lsblk -f -o 'NAME,FSTYPE,SIZE,FSUSE%,MOUNTPOINTS,UUID' >/dev/null 2>&1; then
            lsblk -f -o 'NAME,FSTYPE,SIZE,FSUSE%,MOUNTPOINTS,UUID'

          elif lsblk -f -o 'NAME,FSTYPE,SIZE,MOUNTPOINT,UUID' >/dev/null 2>&1; then
            lsblk -f -o 'NAME,FSTYPE,SIZE,MOUNTPOINT,UUID'

          elif lsblk -f -o 'NAME,FSTYPE,SIZE' >/dev/null 2>&1; then
            lsblk -f -o 'NAME,FSTYPE,SIZE'

          else
            echo "lsblk failed"
          fi

          echo
          echo "=== Largest ${TOP_N} files under ${HOME_PATH} (bytes path) ==="

          if [ -d "$HOME_PATH" ]; then
            find "$HOME_PATH" \
              \( \
                -path '*/.cache/*' -o \
                -path '*/.minikube/*' -o \
                -path '*/node_modules/*' \
              \) -prune -o \
              -type f \
              ! -name '*.tmp' \
              ! -name '*.swp' \
              -printf '%s\t%p\n' 2>/dev/null |
              sort -nr |
              head -n "$TOP_N"
          else
            echo "${HOME_PATH} does not exist"
          fi

        } | tee "$REPORT"

        echo
        echo "REPORT_PATH=$REPORT"
      register: fs_report
      changed_when: false

    - name: Show filesystem report
      ansible.builtin.debug:
        var: fs_report.stdout_lines
