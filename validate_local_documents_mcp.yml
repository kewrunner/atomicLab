---
- name: Validate local documents MCP
  hosts: all
  gather_facts: false

  vars:
    mcp_service_name: local-documents-mcp
    mcp_port: 8010
    mcp_service_user: "{{ ansible_user }}"
    mcp_workspace_dir: "/home/{{ mcp_service_user }}/mcp-documents-workspace"

  tasks:
    - name: Require one AWX target
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | length == 1
        fail_msg: Select exactly one target using the AWX Limit field.

    - name: Validate exposed directories variable
      ansible.builtin.assert:
        that:
          - mcp_exposed_directories | default('') | trim | length > 0
        fail_msg: Set mcp_exposed_directories to one or more comma-separated absolute paths.

    - name: Normalize exposed directories
      ansible.builtin.set_fact:
        mcp_directory_list: >-
          {{ mcp_exposed_directories.split(',')
             | map('trim')
             | reject('equalto', '')
             | list }}

    - name: Collect service state
      ansible.builtin.service_facts:

    - name: Verify MCP service
      ansible.builtin.assert:
        that:
          - mcp_service_name + '.service' in ansible_facts.services
          - ansible_facts.services[mcp_service_name + '.service'].state == 'running'
          - ansible_facts.services[mcp_service_name + '.service'].status == 'enabled'
        fail_msg: "{{ mcp_service_name }} is not running and enabled."

    - name: Verify MCP listening port
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ mcp_port }}"
        timeout: 10

    - name: Verify exposed directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ mcp_directory_list }}"
      register: mcp_directory_results

    - name: Confirm exposed directories
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "{{ item.item }} is unavailable."
      loop: "{{ mcp_directory_results.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify VS Code MCP configuration
      ansible.builtin.stat:
        path: "{{ mcp_workspace_dir }}/.vscode/mcp.json"
      register: mcp_vscode_config

    - name: Confirm validation result
      ansible.builtin.assert:
        that:
          - mcp_vscode_config.stat.exists
          - mcp_vscode_config.stat.isreg
        success_msg: >-
          Local Documents MCP is running on port {{ mcp_port }}
          and exposes {{ mcp_directory_list | join(', ') }}.
