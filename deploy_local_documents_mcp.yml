---
- name: Deploy local documents MCP
  hosts: all
  gather_facts: true
  become: true

  vars:
    mcp_service_name: local-documents-mcp
    mcp_install_dir: /opt/local-documents-mcp
    mcp_config_dir: /etc/local-documents-mcp
    mcp_port: 8010
    mcp_service_user: "{{ ansible_user }}"
    mcp_workspace_dir: "/home/{{ mcp_service_user }}/mcp-documents-workspace"

  pre_tasks:
    - name: Require one AWX target
      ansible.builtin.assert:
        that:
          - ansible_play_hosts | length == 1
        fail_msg: Select exactly one target using the AWX Limit field.

    - name: Validate exposed directories variable
      ansible.builtin.assert:
        that:
          - mcp_exposed_directories | default('') | trim | length > 0
        fail_msg: Set mcp_exposed_directories to one or more comma-separated absolute paths.

    - name: Normalize exposed directories
      ansible.builtin.set_fact:
        mcp_directory_list: >-
          {{ mcp_exposed_directories.split(',')
             | map('trim')
             | reject('equalto', '')
             | list }}

    - name: Validate exposed directory paths
      ansible.builtin.assert:
        that:
          - item is match('^/')
        fail_msg: "{{ item }} must be an absolute path."
      loop: "{{ mcp_directory_list }}"

    - name: Inspect exposed directories
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ mcp_directory_list }}"
      register: mcp_directory_results

    - name: Require existing exposed directories
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
        fail_msg: "{{ item.item }} must already exist and be a directory."
      loop: "{{ mcp_directory_results.results }}"
      loop_control:
        label: "{{ item.item }}"

  tasks:
    - name: Create MCP directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ mcp_install_dir }}"
        - "{{ mcp_config_dir }}"

    - name: Create Python virtual environment
      ansible.builtin.command:
        cmd: "python3 -m venv {{ mcp_install_dir }}/.venv"
        creates: "{{ mcp_install_dir }}/.venv/bin/python"

    - name: Install MCP Python package
      ansible.builtin.pip:
        name: "mcp>=1.9,<2.0"
        virtualenv: "{{ mcp_install_dir }}/.venv"
      notify: Restart MCP service

    - name: Install MCP server
      ansible.builtin.copy:
        dest: "{{ mcp_install_dir }}/server.py"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          """Minimal read-only MCP filesystem server."""

          import os
          from pathlib import Path
          from mcp.server.fastmcp import FastMCP

          ROOTS = tuple(
              Path(item).resolve(strict=True)
              for item in os.environ["MCP_EXPOSED_DIRECTORIES"].split(",")
              if item
          )
          MAX_SIZE = 5 * 1024 * 1024

          mcp = FastMCP(
              "local-documents",
              host="127.0.0.1",
              port=8010,
          )

          def safe_path(requested_path: str) -> Path:
              requested = Path(requested_path)

              if requested.is_absolute():
                  target = requested.resolve(strict=True)
              elif len(ROOTS) == 1:
                  target = (ROOTS[0] / requested).resolve(strict=True)
              else:
                  raise ValueError(
                      "Use an absolute path when multiple directories are exposed"
                  )

              for root in ROOTS:
                  try:
                      target.relative_to(root)
                      return target
                  except ValueError:
                      continue

              raise ValueError("Requested path is outside the exposed directories")

          @mcp.tool()
          def list_directory(path: str = "") -> list[dict]:
              """List approved roots or the contents of an approved directory."""
              if not path and len(ROOTS) > 1:
                  return [
                      {
                          "name": root.name or str(root),
                          "path": str(root),
                          "is_directory": True,
                      }
                      for root in ROOTS
                  ]

              directory = ROOTS[0] if not path else safe_path(path)

              if not directory.is_dir():
                  raise ValueError("Requested path is not a directory")

              return [
                  {
                      "name": item.name,
                      "path": str(item),
                      "is_directory": item.is_dir(),
                  }
                  for item in sorted(
                      directory.iterdir(),
                      key=lambda entry: entry.name,
                  )
                  if not item.name.startswith(".")
              ]

          @mcp.tool()
          def read_text_file(path: str) -> str:
              """Read one text file beneath the exposed directory."""
              document = safe_path(path)

              if not document.is_file():
                  raise ValueError("Requested path is not a file")

              if document.stat().st_size > MAX_SIZE:
                  raise ValueError("File exceeds the 5 MiB limit")

              return document.read_text(
                  encoding="utf-8",
                  errors="replace",
              )

          if __name__ == "__main__":
              mcp.run(transport="streamable-http")
      notify: Restart MCP service

    - name: Install MCP environment file
      ansible.builtin.copy:
        dest: "{{ mcp_config_dir }}/local-documents-mcp.env"
        owner: root
        group: root
        mode: "0644"
        content: |
          MCP_EXPOSED_DIRECTORIES={{ mcp_directory_list | join(',') }}
      notify: Restart MCP service

    - name: Install systemd service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ mcp_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Local Documents MCP Server
          After=network.target

          [Service]
          Type=simple
          User={{ mcp_service_user }}
          WorkingDirectory={{ mcp_install_dir }}
          EnvironmentFile={{ mcp_config_dir }}/local-documents-mcp.env
          ExecStart={{ mcp_install_dir }}/.venv/bin/python {{ mcp_install_dir }}/server.py
          Restart=on-failure
          RestartSec=5
          NoNewPrivileges=true
          PrivateTmp=true

          [Install]
          WantedBy=multi-user.target
      notify: Restart MCP service

    - name: Install VS Code MCP configuration example
      ansible.builtin.copy:
        dest: "{{ mcp_config_dir }}/vscode-mcp.json"
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "servers": {
              "localDocuments": {
                "type": "http",
                "url": "http://127.0.0.1:8010/mcp"
              }
            }
          }

    - name: Create VS Code MCP workspace
      ansible.builtin.file:
        path: "{{ mcp_workspace_dir }}/.vscode"
        state: directory
        owner: "{{ mcp_service_user }}"
        mode: "0755"

    - name: Configure VS Code MCP workspace
      ansible.builtin.copy:
        src: "{{ mcp_config_dir }}/vscode-mcp.json"
        dest: "{{ mcp_workspace_dir }}/.vscode/mcp.json"
        remote_src: true
        owner: "{{ mcp_service_user }}"
        mode: "0644"

    - name: Enable and start MCP service
      ansible.builtin.systemd:
        name: "{{ mcp_service_name }}"
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart MCP service
      ansible.builtin.systemd:
        name: "{{ mcp_service_name }}"
        enabled: true
        state: restarted
        daemon_reload: true
