---
- name: Validate Apache domain vhost deterministic behavior
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - fixtures/apache-domain-vhost-cases.yml
  tasks:
    - name: Normalize comma-delimited fixture
      ansible.builtin.set_fact:
        fixture_expanded: "{{ comma_domains.split(',') | map('trim') | unique | list }}"

    - name: Assert normalization result
      ansible.builtin.assert:
        that: fixture_expanded == expected_normalized_domains

    - name: Assert backend scheme derivation
      ansible.builtin.assert:
        that:
          - "('http://127.0.0.1:5601' | regex_replace('^http://', 'ws://')) == expected_websocket_backends.http"
          - "('https://backend.example.com:8443' | regex_replace('^https://', 'wss://')) == expected_websocket_backends.https"

    - name: Assert raw os-release parsing behavior
      ansible.builtin.assert:
        that:
          - "(raw_os_release.ubuntu | regex_findall('(?m)^ID=\\\"?([A-Za-z0-9_-]+)\\\"?$') | first | lower) == 'ubuntu'"
          - "(raw_os_release.debian | regex_findall('(?m)^ID=\\\"?([A-Za-z0-9_-]+)\\\"?$') | first | lower) == 'debian'"
          - "(raw_os_release.unsupported | regex_findall('(?m)^ID=\\\"?([A-Za-z0-9_-]+)\\\"?$') | first | lower) not in ['ubuntu', 'debian']"

    - name: Assert deterministic platform marker parsing with CRLF
      ansible.builtin.assert:
        that:
          - "(raw_platform_markers.ubuntu_crlf | regex_findall('(?m)^platform:([A-Za-z0-9_-]+)') | first | lower) == 'ubuntu'"
          - "(raw_platform_markers.debian_crlf | regex_findall('(?m)^platform:([A-Za-z0-9_-]+)') | first | lower) == 'debian'"

    - name: Read deployment and preflight sources
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../apache_domain_vhosts/deploy.yml"
        - "{{ playbook_dir }}/../apache_domain_vhosts/preflight.yml"
        - "{{ playbook_dir }}/../apache_domain_vhosts/tasks/validate_sites.yml"
        - "{{ playbook_dir }}/../apache_domain_vhosts/tasks/raw_write_file.yml"
        - "{{ playbook_dir }}/../apache_domain_vhosts/tasks/raw_configure_site.yml"
        - "{{ playbook_dir }}/../apache_domain_vhosts/tasks/raw_post_validate.yml"
      register: implementation_sources

    - name: Verify compatibility-safe ordering and validation boundaries
      ansible.builtin.assert:
        that:
          - "'gather_facts: false' in (implementation_sources.results[0].content | b64decode)"
          - "'ansible.builtin.raw' in (implementation_sources.results[1].content | b64decode)"
          - "'platform:%s' in (implementation_sources.results[1].content | b64decode)"
          - "'regex_findall' in (implementation_sources.results[1].content | b64decode)"
          - "(implementation_sources.results[2].content | b64decode) is not search('ansible_facts\\.distribution')"
          - "(implementation_sources.results[1].content | b64decode).find('include_tasks: tasks/validate_sites.yml') < (implementation_sources.results[1].content | b64decode).find('Collect compatibility-safe Apache preflight state')"

    - name: Verify POSIX-safe raw ownership and certificate command shape
      ansible.builtin.assert:
        that:
          - "'http_file=' in (implementation_sources.results[1].content | b64decode)"
          - "'https_file=' in (implementation_sources.results[1].content | b64decode)"
          - "'for f in' not in (implementation_sources.results[1].content | b64decode)"
          - "'grep -Fq' in (implementation_sources.results[1].content | b64decode)"
          - "'exit 42' in (implementation_sources.results[1].content | b64decode)"
          - "'certificates:complete:' in (implementation_sources.results[1].content | b64decode)"
          - "'certificates:incomplete:' in (implementation_sources.results[1].content | b64decode)"
          - "ownership_cases.neither_exists == 'no target files'"
          - "ownership_cases.managed_http is search('ownership marker')"
          - "ownership_cases.managed_https is search('ownership marker')"
          - "ownership_cases.unmanaged_http is search('exits 42')"
          - "ownership_cases.unmanaged_https is search('exits 42')"
          - "certificate_cases.complete is search('certificates:complete:')"
          - "certificate_cases.incomplete is search('certificates:incomplete:')"

    - name: Verify explicit raw privilege escalation
      ansible.builtin.assert:
        that:
          - "'ansible.builtin.raw: id -u' in (implementation_sources.results[1].content | b64decode)"
          - "'become: true' in (implementation_sources.results[1].content | b64decode)"
          - "'become_user: root' in (implementation_sources.results[1].content | b64decode)"
          - "'become_method: sudo' in (implementation_sources.results[1].content | b64decode)"
          - "'id -u' in (implementation_sources.results[1].content | b64decode)"
          - "(implementation_sources.results[3].content | b64decode) is search('become: true')"
          - "(implementation_sources.results[4].content | b64decode) is search('become: true')"
          - "(implementation_sources.results[5].content | b64decode) is search('become: true')"
          - "'sudo -S' not in (implementation_sources.results[1].content | b64decode)"
          - "'sudo -S' not in (implementation_sources.results[3].content | b64decode)"
          - "'sudo -S' not in (implementation_sources.results[4].content | b64decode)"
          - "'sudo -S' not in (implementation_sources.results[5].content | b64decode)"
          - "'password' not in (implementation_sources.results[1].content | b64decode | lower)"

    - name: Read HTTP template
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../apache_domain_vhosts/templates/vhost-http.conf.j2"
      register: http_template

    - name: Verify HTTP and WebSocket directives
      ansible.builtin.assert:
        that:
          - "'ProxyPreserveHost On' in (http_template.content | b64decode)"
          - "'ProxyPass' in (http_template.content | b64decode)"
          - "'ProxyPassReverse' in (http_template.content | b64decode)"
          - "'HTTP:Upgrade' in (http_template.content | b64decode)"
          - "'HTTP:Connection' in (http_template.content | b64decode)"
          - "'apache_management_marker' in (http_template.content | b64decode)"
