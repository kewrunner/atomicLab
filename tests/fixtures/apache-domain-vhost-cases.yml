---
single_domain: elastic.atomicharvest.com
comma_domains: "elastic.atomicharvest.com, elastic.wazo.tv, elastic.atomicharvest.com"
invalid_domains:
  - https://bad.example.com
  - bad.example.com/path
  - bad.example.com:443
  - bad example.com
invalid_backends:
  - /relative
  - ftp://backend.example.com
  - http://backend.example.com/path
  - "http://backend.example.com bad"
expected_normalized_domains:
  - elastic.atomicharvest.com
  - elastic.wazo.tv
expected_websocket_backends:
  http: ws://127.0.0.1:5601
  https: wss://backend.example.com:8443
raw_os_release:
  ubuntu: "ID=ubuntu\nVERSION_ID=24.04\n"
  debian: "ID=debian\nVERSION_ID=12\n"
  unsupported: "ID=fedora\nVERSION_ID=40\n"
raw_platform_markers:
  ubuntu_crlf: "platform:ubuntu\r\n"
  debian_crlf: "platform:debian\r\n"
ownership_cases:
  neither_exists: "no target files"
  managed_http: "HTTP target contains ownership marker"
  managed_https: "HTTPS target contains ownership marker"
  unmanaged_http: "HTTP target lacks ownership marker and exits 42"
  unmanaged_https: "HTTPS target lacks ownership marker and exits 42"
certificate_cases:
  complete: "certificates:complete:elastic.atomicharvest.com"
  incomplete: "certificates:incomplete:elastic.atomicharvest.com"
