---
- name: Select supported package set
  ansible.builtin.set_fact:
    local_documents_mcp_packages: "{{ ['python3','python3-pip','ca-certificates','acl'] + (['python3-venv'] if ansible_facts.os_family == 'Debian' else []) }}"
  when: ansible_facts.distribution == 'Ubuntu' and ansible_facts.distribution_major_version == '24'

- name: Select RHEL-compatible package set
  ansible.builtin.set_fact:
    local_documents_mcp_packages: ['python3','python3-pip','python3-virtualenv','ca-certificates','acl']
  when: ansible_facts.os_family == 'RedHat' and ansible_facts.distribution_major_version == '9'

- name: Reject unsupported operating system
  ansible.builtin.assert:
    that: local_documents_mcp_packages is defined
    fail_msg: "Unsupported OS: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}; support Ubuntu 24.04 and RHEL 9-compatible systems."

- name: Install OS dependencies
  ansible.builtin.package:
    name: "{{ local_documents_mcp_packages }}"
    state: present
