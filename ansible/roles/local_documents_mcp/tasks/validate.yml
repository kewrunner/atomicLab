---
- name: Require deployment inputs
  ansible.builtin.assert:
    that:
      - mcp_target_host | default('') | string | trim | length > 0
      - mcp_exposed_directory | default('') | string | trim | length > 0
      - inventory_hostname == mcp_target_host
    fail_msg: "Set non-empty mcp_target_host/mcp_exposed_directory and run only on the exact approved inventory host."

- name: Validate exposed directory syntax
  ansible.builtin.assert:
    that:
      - mcp_exposed_directory is match('^/')
      - mcp_exposed_directory.rstrip('/') not in ['/','/etc','/root','/home','/var','/usr','/opt','/boot','/proc','/sys','/dev','/run']
    fail_msg: "mcp_exposed_directory must be an absolute, non-protected directory."

- name: Inspect exposed directory
  ansible.builtin.stat:
    path: "{{ mcp_exposed_directory }}"
    follow: true
  register: mcp_exposed_stat

- name: Require usable exposed directory
  ansible.builtin.assert:
    that:
      - mcp_exposed_stat.stat.exists
      - mcp_exposed_stat.stat.isdir
    fail_msg: "mcp_exposed_directory must exist and be a directory."

- name: Resolve exposed directory
  ansible.builtin.command: "realpath -e -- {{ mcp_exposed_directory }}"
  register: mcp_canonical_directory
  changed_when: false
  check_mode: false

- name: Reject canonical protected directory
  ansible.builtin.assert:
    that: mcp_canonical_directory.stdout.rstrip('/') not in ['/','/etc','/root','/home','/var','/usr','/opt','/boot','/proc','/sys','/dev','/run']
    fail_msg: "The canonical exposed directory is protected."

- name: Confirm service account can traverse and read
  ansible.builtin.command: "namei -m {{ mcp_canonical_directory.stdout }}"
  register: mcp_access_check
  changed_when: false
  failed_when: false
