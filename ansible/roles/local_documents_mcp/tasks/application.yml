---
- name: Create application and configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ local_documents_mcp_group }}"
    mode: '0750'
  loop:
    - "{{ local_documents_mcp_install_dir }}"
    - "{{ local_documents_mcp_config_dir }}"

- name: Install deterministic requirements
  ansible.builtin.copy:
    dest: "{{ local_documents_mcp_install_dir }}/requirements.txt"
    content: "{{ local_documents_mcp_requirements | join('\n') }}\n"
    owner: root
    group: root
    mode: '0644'
  notify: Restart local documents MCP

- name: Create virtual environment
  ansible.builtin.command: "python3 -m venv {{ local_documents_mcp_install_dir }}/.venv"
  args:
    creates: "{{ local_documents_mcp_install_dir }}/.venv/bin/python"

- name: Install Python dependencies in virtual environment
  ansible.builtin.pip:
    requirements: "{{ local_documents_mcp_install_dir }}/requirements.txt"
    virtualenv: "{{ local_documents_mcp_install_dir }}/.venv"
    virtualenv_command: "python3 -m venv"
  notify: Restart local documents MCP

- name: Render MCP server
  ansible.builtin.template:
    src: local_documents_mcp_server.py.j2
    dest: "{{ local_documents_mcp_install_dir }}/server.py"
    owner: root
    group: root
    mode: '0755'
  notify: Restart local documents MCP

- name: Render environment
  ansible.builtin.template:
    src: local-documents-mcp.env.j2
    dest: "{{ local_documents_mcp_config_dir }}/local-documents-mcp.env"
    owner: root
    group: "{{ local_documents_mcp_group }}"
    mode: '0640'
  notify: Restart local documents MCP
