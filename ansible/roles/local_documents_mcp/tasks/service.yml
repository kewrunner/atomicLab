---
- name: Install systemd service
  ansible.builtin.template:
    src: local-documents-mcp.service.j2
    dest: "/etc/systemd/system/{{ local_documents_mcp_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  notify: Restart local documents MCP
- name: Enable and start service
  ansible.builtin.systemd:
    name: "{{ local_documents_mcp_service_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
