---
# Check Wazuh server health
#
# Purpose:
#   Perform a read-only health check of the Wazuh server stack.
#
# Checks:
#   - Host responds to Ansible
#   - System uptime
#   - wazuh-indexer.service
#   - wazuh-indexer-performance-analyzer.service
#   - wazuh-manager.service
#   - wazuh-dashboard.service
#   - Required Wazuh Manager internal processes
#
# This playbook:
#   - Does not restart services
#   - Does not install packages
#   - Does not modify configuration
#

- name: Check Wazuh server health
  hosts: all
  gather_facts: true
  become: true

  vars:

    wazuh_services:
      - wazuh-indexer.service
      - wazuh-indexer-performance-analyzer.service
      - wazuh-manager.service
      - wazuh-dashboard.service

    wazuh_required_processes:
      - wazuh-modulesd
      - wazuh-monitord
      - wazuh-logcollector
      - wazuh-remoted
      - wazuh-syscheckd
      - wazuh-analysisd
      - wazuh-execd
      - wazuh-db
      - wazuh-apid

    wazuh_control: /var/ossec/bin/wazuh-control

  tasks:

    # -------------------------------------------------------------------------
    # 1. System health
    # -------------------------------------------------------------------------

    - name: Calculate system uptime
      ansible.builtin.set_fact:
        wazuh_uptime_display: >-
          {% if ansible_uptime_seconds | int < 86400 %}
          {{ ((ansible_uptime_seconds | int) / 3600) | round(1) }} hours
          {% else %}
          {{ ((ansible_uptime_seconds | int) / 86400) | round(1) }} days
          {% endif %}

    # -------------------------------------------------------------------------
    # 2. Gather service information
    # -------------------------------------------------------------------------

    - name: Gather service information
      ansible.builtin.service_facts:

    # -------------------------------------------------------------------------
    # 3. Check expected Wazuh services
    # -------------------------------------------------------------------------

    - name: Build Wazuh service health results
      ansible.builtin.set_fact:
        wazuh_service_health: >-
          {{
            wazuh_service_health | default([]) +
            [{
              'service': item,
              'installed': item in ansible_facts.services,
              'state':
                (
                  ansible_facts.services[item].state
                  if item in ansible_facts.services
                  else 'NOT INSTALLED'
                )
            }]
          }}
      loop: "{{ wazuh_services }}"

    # -------------------------------------------------------------------------
    # 4. Determine failed systemd services
    # -------------------------------------------------------------------------

    - name: Determine failed Wazuh services
      ansible.builtin.set_fact:
        wazuh_failed_services: >-
          {{
            wazuh_service_health
            | rejectattr('state', 'equalto', 'running')
            | list
          }}

    # -------------------------------------------------------------------------
    # 5. Check Wazuh Manager internal processes
    # -------------------------------------------------------------------------

    - name: Check for Wazuh control utility
      ansible.builtin.stat:
        path: "{{ wazuh_control }}"
      register: wazuh_control_file

    - name: Check Wazuh Manager internal process status
      ansible.builtin.command:
        argv:
          - "{{ wazuh_control }}"
          - status
      register: wazuh_manager_processes
      changed_when: false
      failed_when: false
      when: wazuh_control_file.stat.exists

    # -------------------------------------------------------------------------
    # 6. Validate required Manager processes
    # -------------------------------------------------------------------------

    - name: Initialize failed Manager process list
      ansible.builtin.set_fact:
        wazuh_failed_processes: []

    - name: Identify required Manager processes that are not running
      ansible.builtin.set_fact:
        wazuh_failed_processes: "{{ wazuh_failed_processes + [item] }}"
      when:
        - wazuh_control_file.stat.exists
        - (item ~ ' is running...') not in
          (wazuh_manager_processes.stdout_lines | default([]))
      loop: "{{ wazuh_required_processes }}"
      loop_control:
        label: "{{ item }}"

    # -------------------------------------------------------------------------
    # 7. Determine Manager process health
    # -------------------------------------------------------------------------

    - name: Determine Wazuh Manager process health
      ansible.builtin.set_fact:
        wazuh_manager_process_health: >-
          {{
            'HEALTHY'
            if (
              wazuh_control_file.stat.exists
              and wazuh_failed_processes | length == 0
            )
            else
              (
                'NOT AVAILABLE'
                if not wazuh_control_file.stat.exists
                else 'UNHEALTHY'
              )
          }}

    # -------------------------------------------------------------------------
    # 8. Determine overall Wazuh health
    # -------------------------------------------------------------------------

    - name: Determine overall Wazuh health
      ansible.builtin.set_fact:
        wazuh_overall_health: >-
          {{
            'HEALTHY'
            if (
              wazuh_failed_services | length == 0
              and wazuh_manager_process_health == 'HEALTHY'
            )
            else 'UNHEALTHY'
          }}

    # -------------------------------------------------------------------------
    # 9. Display Wazuh service health
    # -------------------------------------------------------------------------

    - name: Display Wazuh service health
      ansible.builtin.debug:
        msg:
          - "Service: {{ item.service }}"
          - "Installed: {{ item.installed }}"
          - "State: {{ item.state }}"
      loop: "{{ wazuh_service_health }}"
      loop_control:
        label: "{{ item.service }}"

    # -------------------------------------------------------------------------
    # 10. Display Wazuh Manager process status
    # -------------------------------------------------------------------------

    - name: Display Wazuh Manager process status
      ansible.builtin.debug:
        var: wazuh_manager_processes.stdout_lines
      when: wazuh_control_file.stat.exists

    # -------------------------------------------------------------------------
    # 11. Display required process failures
    # -------------------------------------------------------------------------

    - name: Display required Wazuh process validation
      ansible.builtin.debug:
        msg: >-
          {{
            'All required Wazuh Manager processes are running.'
            if wazuh_failed_processes | length == 0
            else
            'Required processes not running: ' +
            (wazuh_failed_processes | join(', '))
          }}

    # -------------------------------------------------------------------------
    # 12. Final health summary
    # -------------------------------------------------------------------------

    - name: Display Wazuh server health summary
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - "WAZUH SERVER HEALTH REPORT"
          - "============================================================"
          - "Host: {{ inventory_hostname }}"
          - "IP: {{ ansible_default_ipv4.address | default(ansible_host | default('UNKNOWN')) }}"
          - "System responding: YES"
          - "Uptime: {{ wazuh_uptime_display | trim }}"
          - ""
          - "Indexer: {{ ansible_facts.services['wazuh-indexer.service'].state | default('NOT INSTALLED') }}"
          - "Indexer Performance Analyzer: {{ ansible_facts.services['wazuh-indexer-performance-analyzer.service'].state | default('NOT INSTALLED') }}"
          - "Manager: {{ ansible_facts.services['wazuh-manager.service'].state | default('NOT INSTALLED') }}"
          - "Dashboard: {{ ansible_facts.services['wazuh-dashboard.service'].state | default('NOT INSTALLED') }}"
          - ""
          - "Required Manager processes: {{ wazuh_manager_process_health }}"
          - "Failed required processes: {{ wazuh_failed_processes | join(', ') if wazuh_failed_processes | length > 0 else 'NONE' }}"
          - ""
          - "Overall health: {{ wazuh_overall_health }}"
          - "============================================================"

    # -------------------------------------------------------------------------
    # 13. Final validation
    # -------------------------------------------------------------------------

    - name: Validate Wazuh server health
      ansible.builtin.assert:
        that:
          - wazuh_overall_health == 'HEALTHY'
        success_msg: "PASS: Wazuh server is healthy."
        fail_msg: >-
          FAIL: Wazuh server health check detected a problem.
          Failed services: {{
            wazuh_failed_services
            | map(attribute='service')
            | list
          }}.
          Failed required Manager processes: {{
            wazuh_failed_processes
          }}.
