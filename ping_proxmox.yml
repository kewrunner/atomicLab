---
- name: Validate AWX connectivity to WAZO lab through Proxmox
  hosts: all
  gather_facts: false
  become: false

  tasks:

    - name: Validate SSH connectivity through Proxmox proxy
      ansible.builtin.raw: |
        printf 'AWX_PROXY_OK host=%s user=%s\n' "$(hostname)" "$(id -un)"
      register: awx_proxy_test
      changed_when: false
      ignore_errors: true
      ignore_unreachable: true

    - name: Report proxy connectivity result
      ansible.builtin.debug:
        msg:
          - "HOST: {{ inventory_hostname }}"
          - >-
            STATUS: {{
              'FAILED'
              if (
                awx_proxy_test.unreachable | default(false) | bool
                or awx_proxy_test.failed | default(false) | bool
                or awx_proxy_test.rc | default(0) | int != 0
              )
              else 'PASSED'
            }}
          - >-
            DETAIL: {{
              awx_proxy_test.msg
              | default(
                  awx_proxy_test.stdout
                  | default(
                      awx_proxy_test.stderr
                      | default('No result returned')
                    )
                )
            }}
