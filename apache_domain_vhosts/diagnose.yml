---
- name: Diagnose Apache domain vhost compatibility
  hosts: all
  gather_facts: false
  tasks:
    - name: Collect controller-safe target diagnostics
      ansible.builtin.raw: >-
        printf 'ansible raw compatibility probe\n';
        cat /etc/os-release 2>/dev/null || true;
        printf 'python='; python3 --version 2>&1 || true
      changed_when: false
