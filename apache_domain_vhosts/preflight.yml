---
- name: Normalize survey input
  ansible.builtin.include_tasks: tasks/normalize_sites.yml

- name: Validate requested values before remote mutation
  ansible.builtin.include_tasks: tasks/validate_sites.yml
  when: apache_sites_to_add | length > 0

- name: Collect compatibility-safe Apache preflight state
  ansible.builtin.raw: >-
    printf '%s\n' '---OS---'; cat /etc/os-release 2>/dev/null || true;
    printf '%s\n' '---PATHS---';
    for p in /etc/apache2 /etc/apache2/sites-available /usr/sbin/apache2ctl /usr/sbin/a2ensite; do
      if [ -e "$p" ]; then printf 'exists:%s\n' "$p"; else printf 'missing:%s\n' "$p"; fi;
    done;
    printf '%s\n' '---SERVICE---';
    if systemctl list-unit-files apache2.service 2>/dev/null | grep -q apache2.service; then printf 'service:exists\n'; else printf 'service:missing\n'; fi;
    printf '%s\n' '---MODULES---'; /usr/sbin/apache2ctl -M 2>&1 || true
  register: apache_raw_preflight
  changed_when: false
  when: apache_sites_to_add | length > 0

- name: Validate raw preflight platform and tooling
  ansible.builtin.set_fact:
    apache_platform_id: >-
      {{ (apache_raw_preflight.stdout
          | regex_findall('(?m)^ID="?([A-Za-z0-9_-]+)"?$')
          | first | default('')) | lower }}
  when: apache_sites_to_add | length > 0

- name: Validate raw preflight platform and tooling
  ansible.builtin.assert:
    that:
      - apache_raw_preflight.rc == 0
      - apache_platform_id in ['ubuntu', 'debian']
      - "'exists:/etc/apache2' in apache_raw_preflight.stdout"
      - "'exists:/etc/apache2/sites-available' in apache_raw_preflight.stdout"
      - "'exists:/usr/sbin/apache2ctl' in apache_raw_preflight.stdout"
      - "'exists:/usr/sbin/a2ensite' in apache_raw_preflight.stdout"
      - "'service:exists' in apache_raw_preflight.stdout"
      - apache_raw_preflight.stdout is search('proxy_module')
      - apache_raw_preflight.stdout is search('proxy_http_module')
      - apache_raw_preflight.stdout is search('proxy_wstunnel_module')
      - apache_raw_preflight.stdout is search('rewrite_module')
    fail_msg: >-
      Raw Apache preflight failed. Supported Ubuntu/Debian platform, layout,
      service, tooling, or required modules were not detected.
  when: apache_sites_to_add | length > 0

- name: Select execution mode before mutation
  ansible.builtin.set_fact:
    apache_execution_mode: >-
      {{ apache_forced_mode | default('') if apache_forced_mode | default('') in ['native', 'raw_compat']
         else 'raw_compat' if (ansible_version.full is version('2.10', '<'))
         else 'native' }}
  when: apache_sites_to_add | length > 0

- name: Report selected execution mode
  ansible.builtin.debug:
    msg: "Apache domain vhost execution mode: {{ apache_execution_mode }}"
  when: apache_sites_to_add | length > 0

- name: Preflight requested target ownership and certificate state
  ansible.builtin.raw: >-
    set -eu;
    for f in
      '{{ apache_sites_available }}/{{ item }}.conf'
      '{{ apache_sites_available }}/{{ item }}-le-ssl.conf'; do
      if [ -e "$f" ] && ! grep -Fq '{{ apache_management_marker }}' "$f"; then
        printf 'unmanaged:%s\n' "$f"; exit 42;
      fi;
    done;
    if [ -f '{{ apache_cert_root }}/{{ item }}/fullchain.pem' ] &&
       [ -f '{{ apache_cert_root }}/{{ item }}/privkey.pem' ]; then
      printf 'certificates:complete:%s\n' '{{ item }}';
    else printf 'certificates:incomplete:%s\n' '{{ item }}'; fi
  loop: "{{ apache_sites_to_add }}"
  loop_control:
    label: "{{ item }}"
  register: apache_raw_target_preflight
  changed_when: false
  when: apache_sites_to_add | length > 0

- name: Reject any raw preflight ownership collision
  ansible.builtin.assert:
    that: item.rc == 0
    fail_msg: "Raw preflight rejected an unmanaged target or unsafe certificate state: {{ item.stdout }}"
  loop: "{{ apache_raw_target_preflight.results }}"
  when: apache_sites_to_add | length > 0
